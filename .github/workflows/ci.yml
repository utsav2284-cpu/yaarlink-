name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Drizzle migrations
        run: npm run db:check

      - name: Build
        run: npm run build

  database-bootstrap:
    name: Empty-database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yaarlink_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yaarlink_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Drizzle migrations
        run: npm run db:check

      - name: Bootstrap and verify an empty PostgreSQL database
        env:
          BOOTSTRAP_DATABASE_URL: postgresql://postgres:ci-bootstrap-only@127.0.0.1:5432/yaarlink_bootstrap
        run: npm run db:bootstrap:verify
